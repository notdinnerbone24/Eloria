<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module: Chaos Pendulum</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .back-btn { align-self: flex-start; text-decoration: none; color: #a371f7; font-family: 'Fira Code', monospace; border: 1px solid #a371f7; padding: 8px 16px; border-radius: 4px; transition: 0.2s; margin-bottom: 20px; }
        .back-btn:hover { background: rgba(163, 113, 247, 0.1); box-shadow: 0 0 10px rgba(163, 113, 247, 0.3); }
        .module-container { display: flex; gap: 20px; max-width: 1200px; width: 100%; flex-wrap: wrap; justify-content: center; }
        .canvas-container { position: relative; width: 700px; height: 600px; border: 1px solid #30363d; box-shadow: 0 0 20px rgba(0,0,0,0.8); background: #050505; }
        canvas { position: absolute; top: 0; left: 0; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; flex: 1; min-width: 300px; max-width: 400px; }
        h1 { font-family: 'Fira Code', monospace; color: #a371f7; margin-top: 0; }
        .guide { font-size: 14px; color: #8b949e; margin-bottom: 20px; line-height: 1.5; background: #0d1117; padding: 15px; border-left: 3px solid #a371f7; }
        .controls { display: flex; flex-direction: column; gap: 15px; }
        button { font-family: 'Fira Code', monospace; background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 12px; border-radius: 4px; cursor: pointer; transition: 0.2s;}
        button:hover { background: #30363d; }
        #resetBtn { background: #8957e5; color: white; border: none; font-weight: bold;}
        #resetBtn:hover { background: #a371f7; box-shadow: 0 0 15px rgba(163, 113, 247, 0.4); }
        label { font-family: 'Fira Code', monospace; font-size: 12px; color: #8b949e; display: flex; flex-direction: column; gap: 5px; }
        input[type="range"] { width: 100%; accent-color: #a371f7; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">< Return to System</a>
    
    <div class="module-container">
        <div class="canvas-container">
            <canvas id="trailCanvas" width="700" height="600"></canvas>
            <canvas id="rodCanvas" width="700" height="600"></canvas>
        </div>
        
        <div class="panel">
            <h1>Chaos_Pendulum</h1>
            <div class="guide">
                <strong>System Guide:</strong> A double pendulum whose motion is governed by a set of coupled ordinary differential equations.<br><br>
                It exhibits high sensitivity to initial conditions (Chaos Theory), meaning the pattern it draws will never exactly repeat.
            </div>
            
            <div class="controls">
                <label>Gravity<input type="range" id="gSlider" min="0.1" max="2" step="0.1" value="1"></label>
                <label>Mass 1<input type="range" id="m1Slider" min="5" max="30" value="15"></label>
                <label>Mass 2<input type="range" id="m2Slider" min="5" max="30" value="15"></label>
                <button id="resetBtn">RESET SYSTEM</button>
            </div>
        </div>
    </div>

    <script>
        const trailCanvas = document.getElementById('trailCanvas');
        const trailCtx = trailCanvas.getContext('2d');
        const rodCanvas = document.getElementById('rodCanvas');
        const rodCtx = rodCanvas.getContext('2d');
        const cx = rodCanvas.width / 2, cy = 150; 

        let r1 = 150, r2 = 150, m1 = 15, m2 = 15, a1 = Math.PI / 2, a2 = Math.PI / 2, a1_v = 0, a2_v = 0, g = 1;
        let px2 = -1, py2 = -1;

        function resetPendulum() {
            a1 = Math.random() * Math.PI * 2; a2 = Math.random() * Math.PI * 2; a1_v = 0; a2_v = 0; px2 = -1; py2 = -1;
            trailCtx.fillStyle = '#050505'; trailCtx.fillRect(0, 0, trailCanvas.width, trailCanvas.height);
        }
        document.getElementById('resetBtn').addEventListener('click', resetPendulum);
        trailCtx.fillStyle = '#050505'; trailCtx.fillRect(0, 0, trailCanvas.width, trailCanvas.height);

        function animate() {
            g = parseFloat(document.getElementById('gSlider').value);
            m1 = parseFloat(document.getElementById('m1Slider').value);
            m2 = parseFloat(document.getElementById('m2Slider').value);

            let num1 = -g * (2 * m1 + m2) * Math.sin(a1); let num2 = -m2 * g * Math.sin(a1 - 2 * a2);
            let num3 = -2 * Math.sin(a1 - a2) * m2; let num4 = a2_v * a2_v * r2 + a1_v * a1_v * r1 * Math.cos(a1 - a2);
            let den = r1 * (2 * m1 + m2 - m2 * Math.cos(2 * a1 - 2 * a2));
            let a1_a = (num1 + num2 + num3 * num4) / den;

            num1 = 2 * Math.sin(a1 - a2); num2 = (a1_v * a1_v * r1 * (m1 + m2));
            num3 = g * (m1 + m2) * Math.cos(a1); num4 = a2_v * a2_v * r2 * m2 * Math.cos(a1 - a2);
            den = r2 * (2 * m1 + m2 - m2 * Math.cos(2 * a1 - 2 * a2));
            let a2_a = (num1 * (num2 + num3 + num4)) / den;

            a1_v += a1_a; a2_v += a2_a; a1 += a1_v; a2 += a2_v;
            a1_v *= 0.999; a2_v *= 0.999;

            let x1 = cx + r1 * Math.sin(a1), y1 = cy + r1 * Math.cos(a1);
            let x2 = x1 + r2 * Math.sin(a2), y2 = y1 + r2 * Math.cos(a2);

            trailCtx.fillStyle = 'rgba(5, 5, 5, 0.02)'; trailCtx.fillRect(0, 0, trailCanvas.width, trailCanvas.height);
            if (px2 !== -1) {
                trailCtx.beginPath(); trailCtx.moveTo(px2, py2); trailCtx.lineTo(x2, y2);
                trailCtx.strokeStyle = '#a371f7'; trailCtx.lineWidth = 2; trailCtx.shadowBlur = 10;
                trailCtx.shadowColor = '#a371f7'; trailCtx.stroke();
            }
            px2 = x2; py2 = y2;

            rodCtx.clearRect(0, 0, rodCanvas.width, rodCanvas.height);
            rodCtx.beginPath(); rodCtx.moveTo(cx, cy); rodCtx.lineTo(x1, y1); rodCtx.lineTo(x2, y2);
            rodCtx.strokeStyle = '#c9d1d9'; rodCtx.lineWidth = 3; rodCtx.stroke();
            rodCtx.beginPath(); rodCtx.arc(x1, y1, m1 / 1.5, 0, Math.PI * 2); rodCtx.fillStyle = '#8b949e'; rodCtx.fill();
            rodCtx.beginPath(); rodCtx.arc(x2, y2, m2 / 1.5, 0, Math.PI * 2); rodCtx.fillStyle = '#a371f7'; rodCtx.fill();

            requestAnimationFrame(animate);
        }
        animate();
    </script>
    <script src="audio.js"></script>
</body>
</html>
