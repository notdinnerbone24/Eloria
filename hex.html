<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module: Hex Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .back-btn { align-self: flex-start; text-decoration: none; color: #8b949e; font-family: 'Fira Code', monospace; border: 1px solid #8b949e; padding: 8px 16px; border-radius: 4px; transition: 0.2s; margin-bottom: 20px; }
        .back-btn:hover { background: rgba(139, 148, 158, 0.2); color: #c9d1d9; border-color: #c9d1d9; }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 30px; width: 100%; max-width: 800px; }
        h1 { font-family: 'Fira Code', monospace; color: #c9d1d9; margin-top: 0; }
        input[type="text"] { width: 100%; background: #050505; color: #3fb950; font-family: 'Fira Code', monospace; border: 1px solid #30363d; padding: 15px; border-radius: 4px; margin-bottom: 20px; font-size: 18px; box-sizing: border-box;}
        .output-group { margin-bottom: 15px; }
        .output-group label { display: block; font-family: 'Fira Code', monospace; color: #8b949e; margin-bottom: 5px; font-size: 14px;}
        .output-box { background: #0d1117; border: 1px solid #30363d; padding: 10px; border-radius: 4px; font-family: 'Fira Code', monospace; color: #58a6ff; word-wrap: break-word; min-height: 40px;}
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">< Return to System</a>
    <div class="panel">
        <h1>Hex_Matrix Converter</h1>
        <input type="text" id="liveInput" placeholder="Type data here to convert in real-time...">
        
        <div class="output-group">
            <label>Binary Stream:</label>
            <div id="outBinary" class="output-box"></div>
        </div>
        <div class="output-group">
            <label>Hexadecimal:</label>
            <div id="outHex" class="output-box"></div>
        </div>
    </div>
    <script src="audio.js"></script>
    <script>
        document.getElementById('liveInput').addEventListener('input', (e) => {
            const str = e.target.value;
            let bin = '', hex = '';
            for (let i = 0; i < str.length; i++) {
                bin += str[i].charCodeAt(0).toString(2).padStart(8, '0') + ' ';
                hex += str[i].charCodeAt(0).toString(16).toUpperCase().padStart(2, '0') + ' ';
            }
            document.getElementById('outBinary').innerText = bin;
            document.getElementById('outHex').innerText = hex;
        });
    </script>
</body>
</html>
