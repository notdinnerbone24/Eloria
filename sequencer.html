<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module: Cyber Sequencer</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap');

:root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #21262d;
    --border: #30363d;
    --accent: #e3b341;
    --text: #c9d1d9;
    --muted: #8b949e;
    --danger: #f85149;
    --green: #3fb950;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, rgba(227,179,65,.08), transparent 35%),
        var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
}

.back-btn {
    display: inline-block;
    text-decoration: none;
    color: var(--accent);
    font-family: 'Fira Code', monospace;
    border: 1px solid var(--accent);
    padding: 8px 16px;
    border-radius: 4px;
    transition: .2s;
    margin-bottom: 20px;
}

.back-btn:hover {
    background: rgba(227,179,65,.1);
    box-shadow: 0 0 12px rgba(227,179,65,.3);
}

.panel {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 28px;
    background: rgba(22,27,34,.96);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

h1 {
    margin: 0 0 6px;
    color: var(--accent);
    font-family: 'Fira Code', monospace;
    letter-spacing: 1px;
}

.subtitle {
    margin-bottom: 25px;
    color: var(--muted);
    font-family: 'Fira Code', monospace;
    font-size: 13px;
}

/* SEQUENCER */

.grid-wrapper {
    overflow-x: auto;
    padding: 10px 0 15px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(16, minmax(35px, 1fr));
    gap: 5px;
    min-width: 680px;
}

.cell {
    aspect-ratio: 1;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: .1s;
    position: relative;
}

.cell:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
}

.cell.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(227,179,65,.45);
}

.cell.playing {
    outline: 2px solid white;
    transform: scale(1.08);
    filter: brightness(1.35);
    z-index: 2;
}

.cell.playing.active {
    box-shadow:
        0 0 12px var(--accent),
        0 0 25px rgba(227,179,65,.35);
}

/* STEP NUMBERS */

.step-numbers {
    display: grid;
    grid-template-columns: repeat(16, minmax(35px, 1fr));
    gap: 5px;
    min-width: 680px;
    margin-bottom: 4px;
}

.step-number {
    text-align: center;
    color: var(--muted);
    font: 11px 'Fira Code', monospace;
}

/* CONTROLS */

.controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 20px;
}

.control {
    background: #11161d;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    text-align: left;
}

.control label {
    display: block;
    color: var(--muted);
    font: 11px 'Fira Code', monospace;
    margin-bottom: 7px;
}

.value {
    color: var(--accent);
    font: 600 13px 'Fira Code', monospace;
    float: right;
}

select,
input[type="range"] {
    width: 100%;
}

select {
    background: #0d1117;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 7px;
    font-family: 'Fira Code', monospace;
}

input[type="range"] {
    accent-color: var(--accent);
}

/* BUTTONS */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

button {
    font-family: 'Fira Code', monospace;
    font-weight: bold;
    background: var(--accent);
    color: #000;
    border: none;
    padding: 10px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: .15s;
}

button:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
}

button.secondary {
    background: #21262d;
    color: var(--text);
    border: 1px solid var(--border);
}

button.danger {
    background: var(--danger);
    color: white;
}

button.active {
    background: var(--green);
    color: #000;
}

/* INFO */

.status {
    margin-top: 18px;
    padding: 12px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 5px;
    font: 12px 'Fira Code', monospace;
    color: var(--muted);
}

.status span {
    color: var(--accent);
}

.meters {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.meter {
    background: #0d1117;
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 5px;
    text-align: center;
}

.meter-title {
    display: block;
    color: var(--muted);
    font-size: 10px;
    font-family: 'Fira Code', monospace;
}

.meter-value {
    display: block;
    margin-top: 4px;
    color: var(--accent);
    font: 600 14px 'Fira Code', monospace;
}

/* RESPONSIVE */

@media(max-width: 750px) {
    .controls {
        grid-template-columns: repeat(2, 1fr);
    }

    .meters {
        grid-template-columns: repeat(2, 1fr);
    }

    .panel {
        padding: 18px;
    }
}

@media(max-width: 450px) {
    .controls {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<a href="index.html" class="back-btn">&lt; Return to System</a>

<div class="panel">

    <h1>Cyber_Sequencer</h1>
    <div class="subtitle">16-STEP // 4-VOICE // WEB AUDIO ENGINE</div>

    <div class="grid-wrapper">

        <div class="step-numbers" id="stepNumbers"></div>

        <div class="grid" id="seqGrid"></div>

    </div>

    <div class="controls">

        <div class="control">
            <label>
                TEMPO
                <span class="value" id="tempoValue">120 BPM</span>
            </label>
            <input
                id="tempo"
                type="range"
                min="50"
                max="240"
                value="120"
            >
        </div>

        <div class="control">
            <label>
                VOLUME
                <span class="value" id="volumeValue">40%</span>
            </label>
            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.4"
            >
        </div>

        <div class="control">
            <label>WAVEFORM</label>
            <select id="waveform">
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
                <option value="sine">Sine</option>
            </select>
        </div>

        <div class="control">
            <label>
                NOTE LENGTH
                <span class="value" id="lengthValue">80%</span>
            </label>
            <input
                id="noteLength"
                type="range"
                min="10"
                max="100"
                value="80"
            >
        </div>

    </div>

    <div class="buttons">

        <button id="playBtn">
            ▶ PLAY SEQUENCER
        </button>

        <button class="secondary" id="clearBtn">
            CLEAR
        </button>

        <button class="secondary" id="randomBtn">
            RANDOMIZE
        </button>

        <button class="secondary" id="demoBtn">
            LOAD DEMO
        </button>

        <button class="secondary" id="muteBtn">
            MUTE
        </button>

    </div>

    <div class="status">
        STATUS:
        <span id="statusText">READY</span>
        //
        STEP:
        <span id="currentStepText">--</span>
    </div>

    <div class="meters">

        <div class="meter">
            <span class="meter-title">TEMPO</span>
            <span class="meter-value" id="meterTempo">120 BPM</span>
        </div>

        <div class="meter">
            <span class="meter-title">STEP TIME</span>
            <span class="meter-value" id="meterTime">125 ms</span>
        </div>

        <div class="meter">
            <span class="meter-title">ACTIVE NOTES</span>
            <span class="meter-value" id="activeCount">0</span>
        </div>

        <div class="meter">
            <span class="meter-title">AUDIO</span>
            <span class="meter-value" id="audioState">OFF</span>
        </div>

    </div>

</div>

<script>
/* =========================================
   CYBER SEQUENCER AUDIO ENGINE
   ========================================= */

const rows = 4;
const cols = 16;

/*
    C5
    A4
    E4
    C4
*/
const freqs = [
    523.25,
    440.00,
    329.63,
    261.63
];

const grid = document.getElementById('seqGrid');
const stepNumbers = document.getElementById('stepNumbers');

const playBtn = document.getElementById('playBtn');
const clearBtn = document.getElementById('clearBtn');
const randomBtn = document.getElementById('randomBtn');
const demoBtn = document.getElementById('demoBtn');
const muteBtn = document.getElementById('muteBtn');

const tempo = document.getElementById('tempo');
const volume = document.getElementById('volume');
const waveform = document.getElementById('waveform');
const noteLength = document.getElementById('noteLength');

const tempoValue = document.getElementById('tempoValue');
const volumeValue = document.getElementById('volumeValue');
const lengthValue = document.getElementById('lengthValue');

const statusText = document.getElementById('statusText');
const currentStepText = document.getElementById('currentStepText');

const meterTempo = document.getElementById('meterTempo');
const meterTime = document.getElementById('meterTime');
const activeCount = document.getElementById('activeCount');
const audioState = document.getElementById('audioState');


/* =========================================
   STATE
   ========================================= */

let isPlaying = false;
let currentStep = 0;
let timer = null;

let audioCtx = null;
let masterGain = null;

let muted = false;


/* =========================================
   CREATE GRID
   ========================================= */

for (let c = 0; c < cols; c++) {

    const number = document.createElement('div');

    number.className = 'step-number';
    number.textContent = c + 1;

    stepNumbers.appendChild(number);
}


for (let r = 0; r < rows; r++) {

    for (let c = 0; c < cols; c++) {

        const cell = document.createElement('div');

        cell.className = 'cell';

        cell.dataset.row = r;
        cell.dataset.col = c;

        cell.addEventListener('click', () => {

            cell.classList.toggle('active');

            updateActiveCount();

        });

        grid.appendChild(cell);
    }
}


/* =========================================
   AUDIO INITIALIZATION
   ========================================= */

function initAudio() {

    if (audioCtx) return;

    audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    masterGain = audioCtx.createGain();

    masterGain.gain.value = Number(volume.value);

    masterGain.connect(audioCtx.destination);

    audioState.textContent = 'READY';
}


/* =========================================
   PLAY SINGLE NOTE
   ========================================= */

function playNote(frequency) {

    initAudio();

    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    const now = audioCtx.currentTime;

    const stepMs = getStepTime();
    const duration =
        (stepMs / 1000) *
        (Number(noteLength.value) / 100);

    oscillator.type = waveform.value;
    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    /*
        Short envelope prevents clicks.
    */

    gain.gain.setValueAtTime(0.0001, now);

    gain.gain.exponentialRampToValueAtTime(
        1,
        now + 0.008
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + Math.max(0.02, duration)
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);

    oscillator.stop(
        now + Math.max(0.03, duration + 0.02)
    );
}


/* =========================================
   PLAY STEP
   ========================================= */

function playStep() {

    document
        .querySelectorAll('.cell.playing')
        .forEach(cell => {
            cell.classList.remove('playing');
        });

    let notesPlayed = 0;

    for (let r = 0; r < rows; r++) {

        const cell = document.querySelector(
            `.cell[data-row="${r}"][data-col="${currentStep}"]`
        );

        if (!cell) continue;

        cell.classList.add('playing');

        if (cell.classList.contains('active')) {

            playNote(freqs[r]);

            notesPlayed++;
        }
    }

    currentStepText.textContent =
        String(currentStep + 1).padStart(2, '0');

    statusText.textContent =
        notesPlayed > 0
            ? `PLAYING // ${notesPlayed} NOTE${notesPlayed > 1 ? 'S' : ''}`
            : 'PLAYING // REST';

    currentStep++;

    if (currentStep >= cols) {
        currentStep = 0;
    }
}


/* =========================================
   TIMING
   ========================================= */

function getStepTime() {

    const bpm = Number(tempo.value);

    /*
        One sequencer step = 1/16 note.
    */

    return 60000 / bpm / 4;
}


function restartTimer() {

    if (!isPlaying) return;

    clearInterval(timer);

    timer = setInterval(
        playStep,
        getStepTime()
    );
}


/* =========================================
   PLAY / STOP
   ========================================= */

function startSequencer() {

    initAudio();

    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    isPlaying = true;

    currentStep = 0;

    playBtn.textContent = '■ STOP SEQUENCER';

    playBtn.classList.add('active');

    audioState.textContent = 'ON';

    statusText.textContent = 'PLAYING';

    playStep();

    restartTimer();
}


function stopSequencer() {

    isPlaying = false;

    clearInterval(timer);

    timer = null;

    document
        .querySelectorAll('.cell.playing')
        .forEach(cell => {
            cell.classList.remove('playing');
        });

    playBtn.textContent = '▶ PLAY SEQUENCER';

    playBtn.classList.remove('active');

    audioState.textContent = audioCtx
        ? 'READY'
        : 'OFF';

    statusText.textContent = 'STOPPED';

    currentStepText.textContent = '--';
}


playBtn.addEventListener('click', () => {

    if (isPlaying) {
        stopSequencer();
    } else {
        startSequencer();
    }

});


/* =========================================
   TEMPO
   ========================================= */

tempo.addEventListener('input', () => {

    const bpm = Number(tempo.value);

    tempoValue.textContent =
        `${bpm} BPM`;

    meterTempo.textContent =
        `${bpm} BPM`;

    meterTime.textContent =
        `${getStepTime().toFixed(1)} ms`;

    restartTimer();
});


/* =========================================
   VOLUME
   ========================================= */

volume.addEventListener('input', () => {

    const value = Number(volume.value);

    volumeValue.textContent =
        `${Math.round(value * 100)}%`;

    if (masterGain && !muted) {

        masterGain.gain.setTargetAtTime(
            value,
            audioCtx.currentTime,
            0.01
        );
    }
});


/* =========================================
   NOTE LENGTH
   ========================================= */

noteLength.addEventListener('input', () => {

    lengthValue.textContent =
        `${noteLength.value}%`;
});


/* =========================================
   MUTE
   ========================================= */

muteBtn.addEventListener('click', () => {

    initAudio();

    muted = !muted;

    if (muted) {

        masterGain.gain.setTargetAtTime(
            0,
            audioCtx.currentTime,
            0.01
        );

        muteBtn.textContent = 'UNMUTE';
        muteBtn.classList.add('danger');

    } else {

        masterGain.gain.setTargetAtTime(
            Number(volume.value),
            audioCtx.currentTime,
            0.01
        );

        muteBtn.textContent = 'MUTE';
        muteBtn.classList.remove('danger');
    }
});


/* =========================================
   CLEAR
   ========================================= */

clearBtn.addEventListener('click', () => {

    document
        .querySelectorAll('.cell.active')
        .forEach(cell => {
            cell.classList.remove('active');
        });

    updateActiveCount();

    statusText.textContent = 'PATTERN CLEARED';
});


/* =========================================
   RANDOMIZE
   ========================================= */

randomBtn.addEventListener('click', () => {

    document
        .querySelectorAll('.cell')
        .forEach(cell => {

            cell.classList.toggle(
                'active',
                Math.random() > 0.68
            );

        });

    updateActiveCount();

    statusText.textContent =
        'RANDOM PATTERN GENERATED';
});


/* =========================================
   DEMO PATTERN
   ========================================= */

demoBtn.addEventListener('click', () => {

    document
        .querySelectorAll('.cell')
        .forEach(cell => {
            cell.classList.remove('active');
        });

    /*
        Row 0 - C5
    */

    [0, 4, 8, 12].forEach(c => {
        getCell(0, c).classList.add('active');
    });

    /*
        Row 1 - A4
    */

    [2, 6, 10, 14].forEach(c => {
        getCell(1, c).classList.add('active');
    });

    /*
        Row 2 - E4
    */

    [1, 5, 9, 13].forEach(c => {
        getCell(2, c).classList.add('active');
    });

    /*
        Row 3 - C4
    */

    [0, 8].forEach(c => {
        getCell(3, c).classList.add('active');
    });

    updateActiveCount();

    statusText.textContent =
        'DEMO PATTERN LOADED';
});


function getCell(row, col) {

    return document.querySelector(
        `.cell[data-row="${row}"][data-col="${col}"]`
    );
}


/* =========================================
   ACTIVE NOTE COUNTER
   ========================================= */

function updateActiveCount() {

    const count =
        document.querySelectorAll(
            '.cell.active'
        ).length;

    activeCount.textContent = count;
}


/* =========================================
   KEYBOARD SHORTCUTS
   ========================================= */

document.addEventListener('keydown', event => {

    /*
        Space = Play / Stop
    */

    if (
        event.code === 'Space' &&
        event.target.tagName !== 'INPUT'
    ) {

        event.preventDefault();

        if (isPlaying) {
            stopSequencer();
        } else {
            startSequencer();
        }
    }

    /*
        R = Randomize
    */

    if (
        event.key.toLowerCase() === 'r' &&
        event.target.tagName !== 'INPUT'
    ) {

        randomBtn.click();
    }

    /*
        C = Clear
    */

    if (
        event.key.toLowerCase() === 'c' &&
        event.target.tagName !== 'INPUT'
    ) {

        clearBtn.click();
    }
});


/* =========================================
   INITIAL UI
   ========================================= */

tempo.dispatchEvent(new Event('input'));
volume.dispatchEvent(new Event('input'));
noteLength.dispatchEvent(new Event('input'));

updateActiveCount();

</script>

</body>
</html>
