<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module: Cyber Sequencer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .back-btn { align-self: flex-start; text-decoration: none; color: #e3b341; font-family: 'Fira Code', monospace; border: 1px solid #e3b341; padding: 8px 16px; border-radius: 4px; transition: 0.2s; margin-bottom: 20px; }
        .back-btn:hover { background: rgba(227, 179, 65, 0.1); box-shadow: 0 0 10px rgba(227, 179, 65, 0.3); }
        .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 30px; width: 100%; max-width: 800px; text-align: center; }
        h1 { font-family: 'Fira Code', monospace; color: #e3b341; }
        .grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 5px; margin: 20px 0; }
        .cell { aspect-ratio: 1; background: #21262d; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; transition: 0.1s; }
        .cell.active { background: #e3b341; box-shadow: 0 0 10px #e3b341; border-color: #e3b341; }
        .cell.playing { transform: scale(1.1); filter: brightness(1.5); }
        button { font-family: 'Fira Code', monospace; background: #e3b341; color: #000; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;}
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">< Return to System</a>
    <div class="panel">
        <h1>Cyber_Sequencer</h1>
        <div class="grid" id="seqGrid"></div>
        <button id="playBtn">PLAY SEQUENCER</button>
    </div>
    <script src="audio.js"></script>
    <script>
        const grid = document.getElementById('seqGrid');
        const rows = 4; const cols = 16;
        const freqs = [523.25, 440.00, 329.63, 261.63]; // C5, A4, E4, C4
        let isPlaying = false; let currentStep = 0; let interval;

        // Create Grid
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.row = r; cell.dataset.col = c;
                cell.addEventListener('click', () => cell.classList.toggle('active'));
                grid.appendChild(cell);
            }
        }

        document.getElementById('playBtn').addEventListener('click', (e) => {
            if(isPlaying) { clearInterval(interval); e.target.innerText = "PLAY SEQUENCER"; } 
            else { 
                interval = setInterval(playStep, 150); // 150ms per step
                e.target.innerText = "STOP";
            }
            isPlaying = !isPlaying;
        });

        function playStep() {
            document.querySelectorAll('.cell.playing').forEach(c => c.classList.remove('playing'));
            for(let r=0; r<rows; r++) {
                let cell = document.querySelector(`.cell[data-row="${r}"][data-col="${currentStep}"]`);
                cell.classList.add('playing');
                if(cell.classList.contains('active') && window.sfx) {
                    sfx.playTone(freqs[r], 'square', 0.1, 0.05);
                }
            }
            currentStep = (currentStep + 1) % cols;
        }
    </script>
</body>
</html>
