<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Langton's Ant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .back-btn {
            align-self: flex-start;
            text-decoration: none;
            color: #4ade80;
            font-family: monospace;
            font-size: 16px;
            margin-bottom: 20px;
            border: 1px solid #4ade80;
            padding: 8px 16px;
            border-radius: 4px;
        }
        .back-btn:hover { background: rgba(74, 222, 128, 0.1); }
        h1 { margin-top: 0; font-size: 1.5rem; }
        .controls {
            background: #2b2b36;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.85rem; color: #aaa; }
        input[type="text"], input[type="number"] {
            padding: 5px; border: 1px solid #555; border-radius: 4px;
            background: #1e1e24; color: white; width: 120px;
        }
        input[type="range"] { width: 150px; }
        button {
            padding: 8px 16px; border: none; border-radius: 4px;
            background-color: #4CAF50; color: white; cursor: pointer;
            font-weight: bold; transition: background 0.2s;
        }
        button:hover { background-color: #45a049; }
        button.reset { background-color: #f44336; }
        button.reset:hover { background-color: #d32f2f; }
        canvas { background-color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #444; }
        .presets { margin-top: 10px; font-size: 0.85rem; color: #aaa; }
        .presets span { color: #4CAF50; cursor: pointer; text-decoration: underline; margin: 0 5px; }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">< Return to Main System</a>
    
    <h1>Advanced Langton's Ant Simulator</h1>

    <div class="controls">
        <div class="control-group">
            <label for="ruleInput">Rule String (L/R)</label>
            <input type="text" id="ruleInput" value="LLRR" oninput="this.value = this.value.toUpperCase().replace(/[^LR]/g, '')">
        </div>
        
        <div class="control-group">
            <label for="speedSlider">Speed (Steps/Frame)</label>
            <input type="range" id="speedSlider" min="1" max="5000" value="500">
        </div>

        <div class="control-group">
            <button id="playBtn">Play / Pause</button>
        </div>
        
        <div class="control-group">
            <button id="resetBtn" class="reset">Reset Grid</button>
        </div>
    </div>

    <div class="presets">
        Try Presets: 
        <span onclick="setRule('RL')">Classic (RL)</span> | 
        <span onclick="setRule('LLRR')">Symmetric (LLRR)</span> | 
        <span onclick="setRule('LRRRRRLLR')">Square Pattern (LRRRRRLLR)</span> |
        <span onclick="setRule('LLRRRLRLRLLR')">Convoluted Highway (LLRRRLRLRLLR)</span>
    </div>

    <br>
    <canvas id="gridCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        
        const ruleInput = document.getElementById('ruleInput');
        const speedSlider = document.getElementById('speedSlider');
        const playBtn = document.getElementById('playBtn');
        const resetBtn = document.getElementById('resetBtn');

        const cellSize = 2; 
        const cols = Math.floor(canvas.width / cellSize);
        const rows = Math.floor(canvas.height / cellSize);
        
        let grid = new Uint8Array(cols * rows); 
        let ant = { x: Math.floor(cols / 2), y: Math.floor(rows / 2), dir: 0 };
        
        let ruleString = ruleInput.value;
        let colors = [];
        let isRunning = false;
        let animationId;

        function generateColors(numColors) {
            const newColors = ['#000000']; 
            for (let i = 1; i < numColors; i++) {
                const hue = Math.floor((i / (numColors - 1)) * 360);
                newColors.push(`hsl(${hue}, 80%, 60%)`);
            }
            return newColors;
        }

        function initSimulation() {
            grid.fill(0); 
            ant = { x: Math.floor(cols / 2), y: Math.floor(rows / 2), dir: 0 };
            ruleString = ruleInput.value || "RL";
            colors = generateColors(ruleString.length);
            ctx.fillStyle = colors[0];
            ctx.fillRect(0, 0, canvas.width, canvas.height); 
        }

        function drawCell(x, y, state) {
            ctx.fillStyle = colors[state];
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
        }

        function step() {
            const index = ant.y * cols + ant.x;
            const currentState = grid[index];
            
            const instruction = ruleString[currentState];
            if (instruction === 'R') {
                ant.dir = (ant.dir + 1) % 4; 
            } else if (instruction === 'L') {
                ant.dir = (ant.dir + 3) % 4; 
            }

            const nextState = (currentState + 1) % ruleString.length;
            grid[index] = nextState;
            
            drawCell(ant.x, ant.y, nextState);

            if (ant.dir === 0) ant.y--;       
            else if (ant.dir === 1) ant.x++;  
            else if (ant.dir === 2) ant.y++;  
            else if (ant.dir === 3) ant.x--;  

            if (ant.x < 0) ant.x = cols - 1;
            else if (ant.x >= cols) ant.x = 0;
            if (ant.y < 0) ant.y = rows - 1;
            else if (ant.y >= rows) ant.y = 0;
        }

        function animate() {
            if (!isRunning) return;
            
            const stepsPerFrame = parseInt(speedSlider.value);
            for (let i = 0; i < stepsPerFrame; i++) {
                step();
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        playBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            playBtn.innerText = isRunning ? 'Pause' : 'Play';
            if (isRunning) {
                if(ruleString !== ruleInput.value) {
                    initSimulation();
                }
                animate();
            }
        });

        resetBtn.addEventListener('click', () => {
            initSimulation();
            if(!isRunning) {
                ctx.fillStyle = colors[0];
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        });

        ruleInput.addEventListener('change', () => {
            if (ruleInput.value.length < 2) ruleInput.value = "RL"; 
            initSimulation();
        });

        window.setRule = function(rule) {
            ruleInput.value = rule;
            initSimulation();
            if(!isRunning) playBtn.click(); 
        };

        initSimulation();

    </script>
</body>
</html>
